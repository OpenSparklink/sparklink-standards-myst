<rect width="1327" height="196" fill="#fff"/>
<g fill="none" stroke="#22344a" stroke-width="1.35" font-family="system-ui, sans-serif">
<text x="77" y="32" text-anchor="middle" font-size="16" fill="#22344a" stroke="none">广播信道A</text>
<rect x="43" y="43" width="73" height="32" fill="#fff"/>
<text x="79.5" y="63.29" text-anchor="middle" font-size="13" fill="#22344a" stroke="none">基础广播帧</text>
<path d="M43 75V120H388" marker-end="url(#arrow)"/>
<text x="215.5" y="116" text-anchor="middle" font-size="14" fill="#22344a" stroke="none">辅助指针1</text>
