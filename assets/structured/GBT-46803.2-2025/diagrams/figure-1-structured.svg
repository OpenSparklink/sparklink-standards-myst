<path d="M153 75V103H388" marker-end="url(#arrow)"/>
<text x="270.5" y="99" text-anchor="middle" font-size="14" fill="#22344a" stroke="none">辅助指针2</text>
<text x="297" y="32" text-anchor="middle" font-size="16" fill="#22344a" stroke="none">广播信道C</text>
<rect x="263" y="43" width="73" height="32" fill="#fff"/>
<text x="299.5" y="63.29" text-anchor="middle" font-size="13" fill="#22344a" stroke="none">基础广播帧</text>
<path d="M263 75V86H388" marker-end="url(#arrow)"/>
<text x="325.5" y="82" text-anchor="middle" font-size="14" fill="#22344a" stroke="none">辅助指针3</text>
<rect x="716" y="43" width="73" height="32" fill="#fff"/>
<text x="752.5" y="63.29" text-anchor="middle" font-size="13" fill="#22344a" stroke="none">基础广播帧</text>
<path d="M716 75V120H1048" marker-end="url(#arrow)"/>
<text x="882.0" y="116" text-anchor="middle" font-size="14" fill="#22344a" stroke="none">辅助指针4</text>
<rect x="826" y="43" width="73" height="32" fill="#fff"/>
<text x="862.5" y="63.29" text-anchor="middle" font-size="13" fill="#22344a" stroke="none">基础广播帧</text>
<path d="M826 75V103H1048" marker-end="url(#arrow)"/>
<text x="937.0" y="99" text-anchor="middle" font-size="14" fill="#22344a" stroke="none">辅助指针5</text>
<rect x="936" y="43" width="73" height="32" fill="#fff"/>
<text x="972.5" y="63.29" text-anchor="middle" font-size="13" fill="#22344a" stroke="none">基础广播帧</text>
