<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1327 196" role="img" aria-labelledby="title description">
<title id="title">图 1　基础广播帧和扩展广播帧的发送流程示意图</title>
<desc id="description">两轮基础广播帧发送，辅助指针指向扩展广播帧。保留接收窗口、响应帧和广播周期间隔。</desc>
