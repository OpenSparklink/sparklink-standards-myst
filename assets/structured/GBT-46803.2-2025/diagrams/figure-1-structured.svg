<text x="18.5" y="115.12" text-anchor="middle" font-size="14" fill="#22344a" stroke="none">播</text>
<text x="18.5" y="131.12" text-anchor="middle" font-size="14" fill="#22344a" stroke="none">端</text>
<line x1="43" y1="91" x2="153" y2="91" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="98.0" y="86" text-anchor="middle" font-size="12" fill="#22344a" stroke="none">基础广播帧间隔</text>
