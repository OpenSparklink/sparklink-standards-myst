<text x="1155" y="89" text-anchor="middle" font-size="13" fill="#22344a" stroke="none">扩展广播帧后可继续携带扩展广播帧</text>
<line x1="43" y1="120" x2="43" y2="183"/>
<line x1="716" y1="120" x2="716" y2="181"/>
<line x1="534" y1="183" x2="534" y2="135" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<line x1="655" y1="135" x2="655" y2="184" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<line x1="1122" y1="120" x2="1218" y2="120" marker-end="url(#arrow)"/>
<text x="1169" y="116" text-anchor="middle" font-size="13" fill="#22344a" stroke="none">辅助指针7</text>
<line x1="1292" y1="120" x2="1318" y2="120" marker-end="url(#arrow)"/>
