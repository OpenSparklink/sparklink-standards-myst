  markup: >-
    <ul class="standard-list"><li><p>——若 $K_r>1024*\left(R-\frac1{16}\right)$，则在 $K_r$ 个待编码位前补 $1024*R-K_r$ 个“0”，采用码率 $R$ 码长 1024 进行编码。</p></li>
    <li><p>——若 $K_r\leq1024*\left(R-\frac1{16}\right)$，则在 $K_r$ 个待编码位前补 $\left\lceil K_r/\left(64*\left(R-\frac1{16}\right)\right)\right\rceil*\left(64*\left(R-\frac1{16}\right)\right)-K_r$ 位个“0”：</p>
    <ul class="standard-list"><li><p>●若 $K_r>(1024-64)*\left(R-\frac1{16}\right)$，则采用码率为 $R-\frac1{16}$ 码率的 1024 码长极化码编码；</p></li>
    <li><p>●若 $K_r\leq(1024-64)*\left(R-\frac1{16}\right)$，则计算 $\left\lceil K_r/\left(64*\left(R-\frac1{16}\right)\right)\right\rceil$ 的值并转换为 2 进制，其从最高位到最低位分别对应是否采用 512、256、128、64 码长的编码，“1”为是，“0”为否，计 1 的数量为 $C'$，并根据表 22 针对每个确定采用的码长进行 $\left(R-\frac1{16}\right)$ 码率的极化码编码。</p></li></ul></li></ul>
    <p class="standard-paragraph">总分段数为 $C_{\mathrm{total}}=C+C'-1$。</p>
