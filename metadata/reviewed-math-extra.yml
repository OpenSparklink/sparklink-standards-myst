  markup: &bit_count >-
    <p class="standard-paragraph">计算信道比特序列数 $E_{\mathrm{tot}}$：如果流数 $v=1$，$E_{\mathrm{tot}}=\left[\frac{N_{\mathrm{RE}}}{N_{\mathrm{dup}}}\right]\cdot Q_m$；如果流数 $v=2$，$E_{\mathrm{tot}}=N_{\mathrm{RE}}\cdot Q_m+\left[\frac{N_{\mathrm{RE}}}{N_{\mathrm{dup}}}\right]\cdot Q_m$；如果流数 $v\geq3$，$E_{\mathrm{tot}}=N_{\mathrm{RE}}\cdot Q_m\cdot v$。其中 $N_{\mathrm{RE}}$ 是调度的子载波数，$Q_m$ 是调制方式，$N_{\mathrm{dup}}$ 是调制符号重复次数，$[\cdot]$ 表示向上取整，$v$ 是传输流数。</p>
- code: *slb
  page: 60
  bbox: [40, 699, 550, 742]
  markup: >-
    <p class="standard-paragraph">计算量化初始信息比特数 $N'_{\mathrm{info}}$：$N'_{\mathrm{info}}=\max\left(24,2^n\cdot\operatorname{round}\left(\frac{N_{\mathrm{info}}-24}{2^n}\right)\right)$，其中 $n=\max(3,[\log_2(N_{\mathrm{info}}-24)]-5)$，其中 round 是就近取整数的运算。</p>
- code: *slb
  page: 60
  bbox: [40, 745, 550, 771]
  markup: >-
    <p class="standard-paragraph">计算分段数 $C$：如果 $R\geq5/32$，$C=\left[\frac{E_{\mathrm{tot}}}{N_{\mathrm{max}}}\right]$，其中，$N_{\mathrm{max}}$ 的值为 4096 或 1024。如果</p>
- code: *slb
  page: 61
  bbox: [40, 92, 550, 188]
  markup: >-
    <p class="standard-paragraph">$\operatorname{mod}(E_{\mathrm{tot}},N_{\mathrm{max}})\ne0$ 且 $\left(R>\frac7{16}\parallel C<9\right)$ 且 $(E_{\mathrm{tot}}-C\cdot N_{\mathrm{max}})\cdot R>T$，则 $C=C+1$，否则 $C=\max(1,C)$；其中 $R$ 是调制编码索引指示的编码速率，$T$ 根据码率 $R$ 以及 $N_{\mathrm{max}}$ 确定。如果 $R>2/3$，$T=192\times N_{\mathrm{max}}/4096$，否则 $T=384\times N_{\mathrm{max}}/4096$。如果 $R<5/32$，$C=\left[\frac{3\times N'_{\mathrm{info}}}{N_{\mathrm{max}}}\right]$。</p>
- code: *slb
  page: 61
  bbox: [40, 192, 550, 217]
  markup: >-
    <p class="standard-paragraph">如 $v>1$，$C1=\left[\frac{E_{\mathrm{tot}}}{E_{\mathrm{int}}}\right]$，$C=\max(C1,C)$，其中 $E_{\mathrm{int}}$ 表示信道交织器最大支持的输入长度。</p>
- code: *slb
  page: 61
  bbox: [40, 219, 550, 245]
  markup: >-
    <p class="standard-paragraph">计算信息比特数 $A_{\mathrm{TBS}}$：$A_{\mathrm{TBS}}=8\cdot C\cdot\left[\frac{N'_{\mathrm{info}}+24}{8\cdot C}\right]-24$。</p>
